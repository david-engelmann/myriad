name: docs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: mdbook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install mdBook v0.4.40
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/rust-lang/mdBook/releases/download/v0.4.40/${ARCHIVE}" -o "${ARCHIVE}"
          echo "9ef07fd288ba58ff3b99d1c94e6d414d431c9a61fdb20348e5beb74b823d546b  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "${ARCHIVE}" mdbook
          chmod 0755 mdbook
          rm -f "${ARCHIVE}"
      - name: Build operator handbook
        shell: bash
        run: |
          set -euo pipefail
          ./mdbook build book
          for page in index.html introduction.html guide.html cookbook.html architecture.html formats.html comparison.html performance.html faq.html; do
            test -f "target/book/${page}"
          done
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: target/book

  deploy:
    name: deploy-pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  docs-drift:
    name: docs-drift
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: docs-drift-${{ runner.os }}
      - name: Build release binary
        run: cargo build --release --locked --bin myriad
      - name: Verify man examples and command parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          bin_path = os.path.abspath("target/release/myriad")
          man_path = "man/myriad.1"
          comp_path = os.environ.get("DOCS_DRIFT_COMPLETIONS", "completions/myriad.bash")
          tmp_dir = os.environ.get("RUNNER_TEMP", ".")
          help_path = os.path.join(tmp_dir, "docs-drift-help.txt")
          drift = False

          man_raw = open(man_path, encoding="utf-8").read()
          for ex_cmd in re.findall(r"\.RS 4\n([^\n]+)\n\.RE", man_raw):
              parts = ex_cmd.strip().split()
              if not parts or parts[0] != "myriad":
                  print(f"::warning title=docs drift::unexpected binary in man example {ex_cmd}")
                  drift = True
                  continue
              parts[0] = bin_path
              res = subprocess.run(parts, capture_output=True, text=True)
              exp_code = 1 if ex_cmd.strip() in ("stickler check examples/smelly.diff", "stickler review examples/change_set.json") else 0
              if res.returncode != exp_code:
                  print(f"::warning title=docs drift::man example '{ex_cmd}' exited {res.returncode} (expected {exp_code})")
                  drift = True

          with open(help_path, "w", encoding="utf-8") as fp:
              subprocess.run([bin_path, "--help"], stdout=fp, stderr=subprocess.STDOUT)
          help_txt = open(help_path, encoding="utf-8").read()
          m = re.search(r"\{([^}]+)\}", help_txt, re.DOTALL)
          if not m:
              print("::warning title=docs drift::could not parse command list from --help")
              sys.exit(1)
          bin_cmds = sorted({tok.strip() for tok in m.group(1).split(",") if tok.strip()})

          comp_txt = open(comp_path, encoding="utf-8").read()
          mc = re.search(r'compgen -W "([^"]+)"', comp_txt)
          if not mc:
              print(f"::warning title=docs drift::compgen -W list missing in {comp_path}")
              sys.exit(1)
          comp_cmds = sorted(w for w in mc.group(1).split() if not w.startswith("-"))

          missing_in_comp = sorted(set(bin_cmds) - set(comp_cmds))
          extra_in_comp = sorted(set(comp_cmds) - set(bin_cmds))
          if missing_in_comp:
              print(f"::warning title=docs drift::commands in binary missing from {comp_path} {missing_in_comp}")
              drift = True
          if extra_in_comp:
              print(f"::warning title=docs drift::extra commands in {comp_path} not in binary {extra_in_comp}")
              drift = True

          print(f"docs-drift summary repo=myriad binary_cmds={len(bin_cmds)} completion_cmds={len(comp_cmds)} drift={drift}")
          if drift:
              sys.exit(1)
          PY
