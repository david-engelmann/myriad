name: cross-platform

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: build-and-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: cross-${{ runner.os }}
      - name: Build release binaries
        run: cargo build --release --locked --bin myriad --bin codepoint_scan
      - name: Run codepoint scan
        run: cargo run --release --locked --bin codepoint_scan
      - name: Run test suite (Linux)
        if: runner.os == 'Linux'
        run: cargo test --locked
      - name: Run test suite (macOS)
        if: runner.os == 'macOS'
        run: cargo test --locked
      - name: Run test suite (Windows)
        if: runner.os == 'Windows'
        run: cargo test --locked
      - name: Smoke check release binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/release/myriad"
          OUT_FILE="${RUNNER_TEMP}/smoke.txt"; "$BIN" map examples/winter-ferry.json > "$OUT_FILE"; grep -q "(open)" "$OUT_FILE"; rm -f "$OUT_FILE"
      - name: Smoke check release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/release/myriad.exe"
          $out = & $bin map examples/winter-ferry.json; if ($LASTEXITCODE -ne 0) { exit 1 }; if (-not ($out -join "`n").Contains("(open)")) { exit 1 }; exit 0

  msrv:
    name: msrv (1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.87"
      - name: Check MSRV build
        run: cargo check --locked --all-targets

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check bans, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@bb119f768ea239e765aeaef5769558d4f21213aa # v2.1.5
        with:
          command: check
          command-arguments: "bans licenses sources"

  advisories:
    name: advisories
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check RustSec advisories
        uses: EmbarkStudios/cargo-deny-action@bb119f768ea239e765aeaef5769558d4f21213aa # v2.1.5
        with:
          command: check
          command-arguments: "advisories"
