name: ci
on:
  push:
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Codepoint scan
        run: cargo run --bin codepoint_scan
      - name: Rust format
        run: cargo fmt --check
      - name: Rust lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test
