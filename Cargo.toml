[package]
name = "myriad"
version = "0.1.0"
edition = "2021"

[lib]
path = "rust/src/lib.rs"

[[bin]]
name = "myriad"
path = "rust/src/main.rs"

[[bin]]
name = "codepoint_scan"
path = "rust/src/bin/codepoint_scan.rs"

# The integration tests live beside the library under rust/tests,
# outside the root level tests directory cargo discovers, so each
# one is named here with its path rather than discovered.

[[test]]
name = "test_setup"
path = "rust/tests/test_setup.rs"

[[test]]
name = "test_scan"
path = "rust/tests/test_scan.rs"

[[test]]
name = "test_explorations"
